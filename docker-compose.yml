# Chorus —— 拿 Docker Hub 上的现成镜像跑起来。
#
#   docker compose up -d          启动，浏览器打开 http://localhost:2022
#   docker compose logs -f        看日志
#   docker compose down           停止（数据留在 chorus-data 卷里）
#   docker compose down -v        停止并删除数据
#
# 第一次打开还没有成员：点「管理」，用下面的 CHORUS_ADMIN_TOKEN 进 /admin 把家里人加进去。
# 想先看看长什么样：/admin 里点「写入演示数据」，看完点「清空数据」。
services:
  chorus:
    image: li2zhen/chorus:latest
    container_name: chorus
    restart: unless-stopped
    ports:
      - "2022:2022"
    volumes:
      - chorus-data:/data
    environment:
      - CHORUS_ADMIN_TOKEN=0317        # ← 改成你自己的口令
      - TZ=Asia/Shanghai

volumes:
  chorus-data:
