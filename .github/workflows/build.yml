name: build-and-push

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/chorus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 Go 工具链包（vendor/ 里的 tar 不入库，所以这里缓存）
        id: gocache
        uses: actions/cache@v4
        with:
          path: vendor/go.linux-amd64.tar.gz
          key: go-toolchain-1.24.6-linux-amd64

      - name: 下载 Go 工具链（缓存未命中时）
        if: steps.gocache.outputs.cache-hit != 'true'
        run: |
          mkdir -p vendor
          curl -fsSL https://go.dev/dl/go1.24.6.linux-amd64.tar.gz -o vendor/go.linux-amd64.tar.gz

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
